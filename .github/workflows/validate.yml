name: Validate bridge scripts and examples

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Validate shell scripts
        run: |
          bash -n wsl/feishu-routes.sh wsl/start-all.sh wsl/claude-wrapper
          bash tests/test_start_all_secret.sh
      - name: Validate TOML examples
        run: python -m unittest discover -s tests -p 'test_*.py' -v
  windows-route-parse:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Parse Windows route script without applying routes
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'windows/add-feishu-routes.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
